<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>每日股票交易系统</title>
    <link rel="stylesheet" href="css/shell.css?v=3">
</head>
<body>
    <div class="shell-layout">
        <!-- 左侧菜单栏（支持展开/收起：收起后仅显示图标） -->
        <aside class="shell-sidebar" id="shellSidebar">
            <div class="shell-title">
                <!-- 收起时的迷你标识 -->
                <span class="shell-title-logo" title="每日股票交易系统">DS</span>
                <span class="shell-title-text">DailyStock</span>
            </div>
            <nav class="shell-nav">
                <button class="shell-menu-item active" data-menu="sector" data-src="sector/index.html" title="板块资金流向分析">
                    <svg class="menu-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <rect x="1.5" y="9" width="3" height="5.5" rx="0.5"></rect>
                        <rect x="6.5" y="5.5" width="3" height="9" rx="0.5"></rect>
                        <rect x="11.5" y="2" width="3" height="12.5" rx="0.5"></rect>
                    </svg>
                    <span class="menu-label">板块资金</span>
                </button>
                <button class="shell-menu-item" data-menu="market" data-src="stock/index.html?page=market&embedded=1" title="市场行情异动监控">
                    <svg class="menu-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path d="M1.5 8h2.5l1.5-4 2.5 8 1.5-4h5"></path>
                    </svg>
                    <span class="menu-label">异动监控</span>
                </button>
                <button class="shell-menu-item" data-menu="watchlist" data-src="stock/index.html?page=watchlist&embedded=1" title="自选股监控与管理">
                    <svg class="menu-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path d="M8 1.5l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.3l-3.8 2-.7-4.3-3.1-3 4.3-.6z"></path>
                    </svg>
                    <span class="menu-label">自选</span>
                </button>
                <button class="shell-menu-item" data-menu="settings" data-src="stock/index.html?page=settings&embedded=1" title="系统设置">
                    <svg class="menu-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <circle cx="8" cy="8" r="2.2"></circle>
                        <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"></path>
                    </svg>
                    <span class="menu-label">设置</span>
                </button>
            </nav>
            <!-- 展开/收起切换按钮（固定在菜单栏底部） -->
            <button class="shell-collapse-btn" id="btnCollapse" title="收起菜单" aria-label="收起菜单">
                <svg class="menu-icon collapse-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path d="M10 3.5L5.5 8l4.5 4.5"></path>
                </svg>
            </button>
        </aside>

        <!-- 主内容区：iframe 加载子应用 -->
        <main class="shell-main">
            <iframe id="appFrame" class="app-frame" src="sector/index.html" title="功能页面"></iframe>
        </main>
    </div>

    <script src="js/shell.js?v=3"></script>
</body>
</html>
